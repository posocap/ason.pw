    body { overflow: hidden; position: relative; background: radial-gradient(ellipse at 50% 120%, #1b1040 0%, #07041a 45%, #000 80%); }
    .nebula {
      position: fixed; inset: -20%; pointer-events: none; filter: blur(60px); opacity: .55;
      background:
        radial-gradient(40% 35% at 20% 30%, rgba(124,58,237,.55), transparent 70%),
        radial-gradient(35% 40% at 80% 25%, rgba(14,165,233,.40), transparent 70%),
        radial-gradient(45% 35% at 60% 85%, rgba(236,72,153,.38), transparent 70%);
      animation: drift 40s ease-in-out infinite alternate;
    }
    .layer { position: fixed; top: 0; left: 0; width: 1px; height: 1px; border-radius: 50%; background: transparent; pointer-events: none; }
    .layer::after { content: ""; position: absolute; top: 2000px; left: 0; width: inherit; height: inherit; border-radius: inherit; box-shadow: inherit; }
    .l1 { box-shadow: var(--s1); animation: twinkle 4s ease-in-out infinite, rise 200s linear infinite; }
    .l2 { width: 2px; height: 2px; box-shadow: var(--s2); animation: twinkle 6s ease-in-out -2s infinite, rise 120s linear infinite; }
    .l3 { width: 3px; height: 3px; box-shadow: var(--s3); animation: twinkle 3s ease-in-out -1s infinite, rise 70s linear infinite; }
    .shoot {
      position: fixed; top: 0; left: 0; width: 140px; height: 2px; opacity: 0; pointer-events: none;
      background: linear-gradient(90deg, #fff, rgba(255,255,255,0));
      transform: rotate(35deg); transform-origin: left center;
      animation: shoot 9s ease-in infinite;
    }
    .shoot.a { top: 8%; left: 70%; animation-delay: 1s; }
    .shoot.b { top: 22%; left: 95%; animation-delay: 5s; animation-duration: 12s; }
    .shoot.c { top: 2%; left: 40%; animation-delay: 8s; animation-duration: 15s; }
    main { position: relative; z-index: 1; }
    h1 {
      background: linear-gradient(100deg, #fff 20%, #c4b5fd 50%, #7dd3fc 80%);
      -webkit-background-clip: text; background-clip: text;
      filter: drop-shadow(0 0 18px rgba(167,139,250,.6)) drop-shadow(0 0 50px rgba(14,165,233,.35));
      animation: glow 6s ease-in-out infinite alternate;
    }
    h1 a { -webkit-text-fill-color: transparent; padding: 0 .06em; }
    p { animation: fade 3s ease-out both .4s; color: #cbd5e1; }
    @keyframes twinkle { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
    @keyframes rise { to { transform: translateY(-2000px) } }
    @keyframes drift { to { transform: translate(4%, -3%) scale(1.1) rotate(4deg) } }
    @keyframes shoot { 0% { opacity: 0; transform: rotate(35deg) translateX(0) } 2% { opacity: 1 } 8% { opacity: 0; transform: rotate(35deg) translateX(-600px) } 100% { opacity: 0 } }
    @keyframes glow { to { filter: drop-shadow(0 0 28px rgba(167,139,250,.9)) drop-shadow(0 0 80px rgba(14,165,233,.5)); } }
    @keyframes fade { from { opacity: 0; letter-spacing: .6em } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
