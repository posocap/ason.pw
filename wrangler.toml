name = "ason-pw"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "ead8c29b274aa64bceed0bfa1c9b4550"

routes = [
  { pattern = "ason.pw", custom_domain = true },
  { pattern = "www.ason.pw", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
# Run src/index.js before static assets so http:// and www. always redirect.
run_worker_first = true

# Required by Worker Previews (non-production branch builds). Previews do not
# inherit production settings; this Worker has no bindings or vars to repeat.
[[d1_databases]]
binding = "DB"
database_name = "ason-pw-story"
database_id = "ed172700-1af5-463c-bd10-8235f9a45d88"
migrations_dir = "migrations"


[previews]
