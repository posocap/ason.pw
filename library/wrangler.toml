name = "ason-peikoff-library"
main = "src/index.js"
compatibility_date = "2025-09-01"
account_id = "ead8c29b274aa64bceed0bfa1c9b4550"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/about", "/about/", "/library", "/library/*", "/post/*", "/robots.txt", "/sitemap.xml"]

# Set SITE_URL to the final domain (e.g. https://example.com) once attached; canonical, sitemap and Open Graph URLs follow it.
[vars]
SITE_URL = ""
# When the domain is attached, set (for example):
#   SITE_URL = "https://www.example.com", WWW_HOST = "www.example.com", APEX_HOST = "example.com"
WWW_HOST = ""
APEX_HOST = ""
